version: '3.8'

services:
  backend:
    build:
      context: ./DevScope.Api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./devscope-web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
